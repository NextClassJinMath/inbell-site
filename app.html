<style>

  :root {

  .web .band { padding: 18px 20px 30px; }

  .web .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; }
  .web .logo { font-size: 17px; }
  .web .logo .tile { width: 28px; height: 28px; }
  .web .pill { font-size: 13px; padding: 4px 12px; max-width: 55%; }
  .web .from { margin-top: 26px; font-size: 13px; color: rgba(255,255,255,.78); position: relative; }

  .web h2 { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 12px; }
  .gains { display: grid; gap: 10px; }

  .gain > div { min-width: 0; }
  .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--white); display: grid; place-items: center; }

  .gain b { display: block; font-size: 15px; font-weight: 700; }

  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: var(--white); font-size: 14px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .step b { display: block; font-size: 15px; font-weight: 700; line-height: 28px; }
  .step div > span { display: block; font-size: 14px; color: var(--soft); line-height: 1.55; }
  .step div > .note { margin-top: 4px; font-size: 13px; }
  .stores { display: grid; gap: 10px; }
  .store { display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 14px; background: var(--black); color: var(--white); text-decoration: none; font-size: 16px; font-weight: 700; }
  .store svg { width: 22px; height: 22px; fill: var(--white); }
  .store:focus-visible, summary:focus-visible { outline: 3px solid var(--navy-c); outline-offset: 2px; }
  .faq { display: grid; gap: 8px; }
  details { background: var(--card); border-radius: 12px; padding: 0 16px; }
  summary { cursor: pointer; list-style: none; padding: 14px 0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }

  body.paper { background: var(--desk); }
  .desk { padding: 24px 16px; display: flex; justify-content: center; }

  .sheet h2 { font-size: 2.8cqw; font-weight: 800; margin-bottom: 1.4cqw; }

  .sheet .ico { width: 6cqw; height: 6cqw; border-radius: 1.8cqw; }
  .sheet .ico svg { width: 3.6cqw; height: 3.6cqw; }
  .sheet .gain b { font-size: 2.1cqw; line-height: 1.4; }
  .sheet .gain span { font-size: 1.85cqw; line-height: 1.45; }
  .row { display: grid; grid-template-columns: 1fr 19cqw; gap: 3cqw; align-items: stretch; }
  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6cqw; }
  .flow li { list-style: none; background: var(--card); border-radius: 1.8cqw; padding: 1.8cqw 1.5cqw; position: relative; min-width: 0; }
  .flow li + li::before { content: "›"; position: absolute; left: -1.6cqw; top: 50%; width: 1.6cqw; text-align: center; transform: translateY(-50%); font-size: 2.6cqw; color: var(--soft); }
  .flow .num { width: 4.4cqw; height: 4.4cqw; font-size: 2.2cqw; }
  .flow b { display: block; margin-top: 1.2cqw; font-size: 2.05cqw; line-height: 1.35; }
  .flow li > span:not(.num) { display: block; margin-top: .5cqw; font-size: 1.6cqw; color: var(--soft); line-height: 1.4; }
  .qr { background: var(--navy); color: var(--white); border-radius: 2.4cqw; padding: 2cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw; text-align: center; }
  .qr .code { background: var(--white); padding: 1.2cqw; border-radius: 1.4cqw; width: 13cqw; height: 13cqw; }
  .qr .code img, .qr .code canvas { width: 100% !important; height: 100% !important; display: block; }
  .qr p { font-size: 1.75cqw; line-height: 1.4; }
  .bottom { margin: auto -7cqw 0; background: var(--tint); padding: 2cqw 7cqw 2.4cqw; display: grid; gap: .3cqw; font-size: 1.7cqw; line-height: 1.5; color: var(--ink); }
  .bottom .q b { font-weight: 700; }
  .bottom .q span { color: var(--soft); }
  .bottom .end { margin-top: .8cqw; display: flex; justify-content: space-between; gap: 2cqw; color: var(--soft); }
  .bottom .end b { color: var(--navy); }
  @page { size: A4 portrait; margin: 0; }
  @media print {
    body.paper { background: var(--white); }
    .desk { padding: 0; display: block; }
    .sheet { max-width: none; width: 210mm; height: 297mm; aspect-ratio: auto; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

        '<p class="foot">학원이 등록한 이름·번호만 쓰고, 학원을 그만두면 앱에서 사라져요 · <a href="' + PRIVACY + '" target="_blank" rel="noopener">개인정보 처리방침</a></p>' +
      '</main>';
    return;
  }

  // ── A4 안내장 ──
  var now = new Date();
  var stamp = (aca ? A + ' · ' : '') + now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월';
  var greet = greetIn ? esc(greetIn) :
    (aca ? '안녕하세요, ' + A + '입니다. ' : '안녕하세요. ') +
    "아이들의 등원·하원과 학원 소식을 더 정확하게 전해 드리려고 '인벨' 앱을 쓰기 시작합니다. 아래 안내를 보시고 설치해 주시면 감사하겠습니다.";
  if (aca) document.title = aca + ' · 인벨 안내장';
  document.body.className = 'paper';
  document.getElementById('root').innerHTML =
    '<div class="desk"><article class="sheet">' +
      '<header class="band">' + bellHtml + topHtml +
        '<h1>이제 학원 소식은<br>인벨로 받아 보세요</h1>' +
        '<p class="lead">등원·하원부터 공지까지, 앱 하나로 빠짐없이</p>' +
        '<p class="stamp">' + stamp + '</p>' +
      '</header>' +
      '<div class="body">' +
        '<div class="greet">' + greet + '</div>' +
        '<section><h2>학부모님께 이런 점이 좋아져요</h2>' + gainsHtml() + '</section>' +
        '<section><h2>이렇게 시작해요</h2><div class="row"><ol class="flow">' +
          '<li><span class="num">1</span><b>앱 다운로드</b><span>QR을 찍어 설치해요</span></li>' +
          '<li><span class="num">2</span><b>번호로 로그인</b><span>인증번호 문자 · 비밀번호 없음</span></li>' +
          '<li><span class="num">3</span><b>초대 수락</b><span>학원 초대장에서 「수락」</span></li>' +
          '<li><span class="num">4</span><b>자녀 등록 동의</b><span>자녀 폰에도 초대장이 가요</span></li>' +
        '</ol><div class="qr"><div class="code" id="qr"></div><p>휴대폰 카메라로<br>찍어 보세요</p></div></div></section>' +
        '<footer class="bottom">' +
          FAQ.map(function (f) { return '<div class="q"><b>' + f[0] + '</b> <span>' + f[1] + '</span></div>'; }).join('') +
          '<div class="end"><span>학원이 등록한 이름·번호만 쓰고, 학원을 그만두면 앱에서 사라져요 · 문의 · ' + (aca ? A : '다니시는 학원') + '</span><b>inbell.co.kr</b></div>' +
        '</footer>' +
      '</div>' +
    '</article></div>';
  try {
    new QRCode(document.getElementById('qr'), { text: link, width: 256, height: 256, colorDark: '#1d1d76', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  } catch (e) {
    document.getElementById('qr').textContent = 'inbell.co.kr/app';
  }
})();
</script>
