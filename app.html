<style>

    --navy-deep: #14144f;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  }
  .top {
    border-bottom: 1px solid var(--line);

  .top .inner, main, footer .inner { max-width: 760px; margin: 0 auto; }
  .top .inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 8px; color: var(--navy); font-weight: 800; font-size: 18px; text-decoration: none; }

  .home { color: var(--ink-soft); font-size: 14px; text-decoration: none; }
  .home:hover { color: var(--navy); text-decoration: underline; }
  main { padding: 40px 16px 72px; }
  h1 { color: var(--navy); font-size: clamp(26px, 6vw, 34px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }
  .meta { color: var(--ink-soft); font-size: 14px; margin-top: 8px; }
  .intro { margin-top: 24px; }
  h2 { color: var(--navy); font-size: 20px; font-weight: 700; margin: 44px 0 12px; line-height: 1.4; }
  h3 { color: var(--navy); font-size: 16px; font-weight: 700; margin: 24px 0 8px; }
  p, li { font-size: 16px; }
  p + p { margin-top: 10px; }
  ul { padding-left: 20px; margin-top: 8px; }
  li + li { margin-top: 4px; }
  .quote { background: var(--gray); border-radius: 12px; padding: 16px 18px; }
  .table-wrap { overflow-x: auto; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 480px; }
  th, td { border: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; }
  th { background: var(--gray); font-weight: 700; white-space: nowrap; }
  a { color: var(--navy); }
  footer { background: var(--navy-deep); color: rgba(255,255,255,0.7); text-align: center; font-size: 14px; padding: 36px 16px; }
  footer .brand { color: var(--white); font-weight: 700; margin-bottom: 8px; }
  footer a { color: rgba(255,255,255,0.7); text-decoration: none; }
  footer a:hover { color: var(--white); text-decoration: underline; }
  footer .sep { margin: 0 8px; opacity: 0.5; }
  footer .mail { margin-top: 6px; }
