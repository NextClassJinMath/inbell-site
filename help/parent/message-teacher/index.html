<nav class="crumb"><a href="../../">기능 안내</a><span class="sep">›</span><a href="../">학부모님</a></nav><h1>선생님께 메시지를 보내고 싶어요</h1><p class="lead">아래 「상담」 탭에서 아이 상담방을 열면 담당 선생님과 바로 이야기할 수 있어요.</p><ol class="steps"><li class="step"><p><span class="num">1</span><span>아래 「상담」 탭을 눌러요.</span></p><div class="shot"><img src="1.webp" alt="아래 「상담」 탭을 눌러요." loading="lazy" decoding="async" width="1080" height="2220"></div></li><li class="step"><p><span class="num">2</span><span>아이 이름과 담당 선생님이 보이는 상담방을 눌러요.</span></p><div class="shot"><img src="2.webp" alt="아이 이름과 담당 선생님이 보이는 상담방을 눌러요." loading="lazy" decoding="async" width="1080" height="2220"></div></li><li class="step"><p><span class="num">3</span><span>아래 칸에 하고 싶은 말을 적고 보내기 단추를 눌러요.</span></p><div class="shot"><img src="3.webp" alt="아래 칸에 하고 싶은 말을 적고 보내기 단추를 눌러요." loading="lazy" decoding="async" width="1080" height="2220"></div></li></ol><div class="endbox"><p>선생님이 답하면 알림이 와요. 원장님과의 방도 같은 목록에 있어요.</p></div><div class="share"><button type="button" id="copy">이 페이지 주소 복사</button></div><p class="allrole"><a href="../">학부모님이 할 수 있는 일 전체 ›</a></p><p class="ver">앱 1.0.71 화면 기준</p><div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var t=document.getElementById('toast');
  function show(m){t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},2200)}
  var url=location.href.split('#')[0];
  var cp=document.getElementById('copy');
  if(cp)cp.addEventListener('click',function(){
    function ok(){show('주소를 복사했어요. 카톡 창에 붙여 넣어 보내 주세요.')}
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(ok,fb)}else fb();
    function fb(){var a=document.createElement('textarea');a.value=url;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){show(url)}document.body.removeChild(a)}
  });
  var kk=document.getElementById('kakao'),key=document.body.getAttribute('data-kakao');
  if(kk&&key){
    var s=document.createElement('script');s.src='https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';s.crossOrigin='anonymous';
    s.onload=function(){try{Kakao.init(key);kk.hidden=false}catch(e){}};document.head.appendChild(s);
    kk.addEventListener('click',function(){Kakao.Share.sendScrap({requestUrl:url})});
  }
})();
</script>
