<style>

.others-h{display:none}

.dlb .short{display:none}
@media (max-width:560px){
 .page{gap:22px!important}

/* 103-C-2 — 짧은 휴대폰 화면(S9 크롬 360×612 등 · 높이 640 이하)만: 위 · 아래 여백을 줄여 스크롤 없이 한 화면(390×690 · 844 는 그대로) */

<style>
/* 103-C-5 — 휴대폰(760 이하) 글자 한 벌: 제목 22 · 부제 14 · 기기 이름 15 · 작은 글 12.5 · 지금 기기 단추 15 / 48(목업) · 모서리 12 */
@media (max-width:760px){h1{font-size:22px!important}.lead{font-size:14px!important}.row .l b,.row.me .l b{font-size:15px!important}.row .l>span{font-size:12.5px!important}.others-h,.row.me .me-top{font-size:12.5px!important}.row.me .dlb{font-size:15px!important;border-radius:12px!important}}
/* 103-C-5 — 태블릿(761~1023): 내용 최대 폭 640 · 좌우 40 · 제목 32 · 부제 17 · 기기 이름 18 · 설명 14.5 · 아이콘 48 · 줄 안쪽 20/18 · 단추 16/48 · 작은 글 15 */
@media (min-width:761px) and (max-width:1023px){.page{max-width:640px!important;padding-left:40px!important;padding-right:40px!important;box-sizing:content-box!important}.page{justify-content:flex-start!important;padding-top:calc(150px + env(safe-area-inset-top,0px))!important}h1{font-size:32px!important}.lead{font-size:17px!important}.row .l b,.row.me .l b{font-size:18px!important}.row .l>span{font-size:14.5px!important}.ic,.row.me .ic{width:48px!important;height:48px!important}.ic svg,.row.me .ic svg{width:26px!important;height:26px!important}.row,.row.me{padding:20px 18px!important}.row.me{grid-template-columns:48px 1fr auto!important}.dlb,.row.me .dlb{font-size:16px!important;height:48px!important;border-radius:12px!important}.others-h,.row.me .me-top{font-size:15px!important}.others-h{margin-left:18px!important}}
</style>
<style>

<script>
(function () {
  var D = window.INBELL_DL || {}; var rows = document.getElementById('rows');
  if (D.PC_SETUP_URL) document.getElementById('pcact').innerHTML = '<a class="dlb" href="' + D.PC_SETUP_URL + '"><span>Windows용 다운로드</span></a>';
  var me = rows.querySelector('[data-os="' + D.os + '"]');
  if (me) { me.classList.add('me'); rows.insertBefore(me, rows.firstChild); }
  // 103-C-6 — PC(1024 이상) 상단 바 로고 · 「다운로드」 = 내용 폭(.page 안쪽)
  function col() { var p = document.querySelector('.page'); if (!p || !window.__barCol) return; if (innerWidth < 1024) { window.__barCol(null); return; }
    var r = p.getBoundingClientRect(), cs = getComputedStyle(p); window.__barCol(Math.round(r.left + parseFloat(cs.paddingLeft)), Math.round(r.right - parseFloat(cs.paddingRight))); }
  col(); addEventListener('resize', col); addEventListener('load', col);
  // 103-C-2 — 카드 맨 위 작은 글 「지금 이 기기」
  if (me) { var mt = document.createElement('div'); mt.className = 'me-top'; mt.textContent = '지금 이 기기'; me.insertBefore(mt, me.firstChild); }
  // 103-C-2 — 휴대폰 폭에서만 보이는 「다른 기기」 제목 · 남은 줄 단추 짧은 글 「다운로드」(PC 는 원래 글 그대로 · CSS 가 고름)
  var oh = document.createElement('div'); oh.className = 'others-h'; oh.textContent = '다른 기기';

    x.replaceWith(f, t);
  });
})();
