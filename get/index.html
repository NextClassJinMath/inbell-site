<style>
  /* 세션 102-M — 흰 바탕 한 장 · 줄 넷 · 지금 기기 줄만 연남색 · 왼쪽 동그라미 그림 하나(같은 남색 선 아이콘 · 사과·윈도우 로고 없음) · 오른쪽 남색 「다운로드」(배지 없음) */
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { background: var(--bg); }
  .page { max-width: 640px; margin: 0 auto; padding: calc(84px + env(safe-area-inset-top, 0px)) 20px 64px; display: flex; flex-direction: column; gap: 28px; }
  h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.8px; }
  .lead { margin: 6px 0 0; font-size: 15.5px; color: var(--mute); }
  .rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 16px; padding: 20px 4px; border-bottom: 1px solid var(--line); scroll-margin-top: 90px; flex-wrap: wrap; }
  .ic { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--chip); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .ic svg { width: 26px; height: 26px; }
  .dlb { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 18px; border-radius: 11px; background: #1D1D76; color: #FFFFFF; font-size: 15px; font-weight: 800; text-decoration: none; }
  .dlb .tri { width: 11px; height: 11px; opacity: .85; } .dlb small { font-size: 11.5px; font-weight: 700; opacity: .8; }
  .dlb.off { background: var(--chip); color: var(--mute); } .soon { font-size: 12.5px; font-weight: 700; color: var(--mute); margin-right: 8px; }
  #pcact { display: inline-flex; align-items: center; }
  .row.me .dlb.off { background: var(--bg); border: 1px solid var(--line); }
  .l { flex: 1 1 180px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .l b { font-size: 17px; font-weight: 800; } .l span { font-size: 13.5px; color: var(--mute); }
  .act { flex: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.me { background: #EEF0FB; border-radius: 16px; border-bottom-color: transparent; padding: 20px 16px; margin: 8px 0; }
  .row.me .l b { font-size: 19px; font-weight: 900; }
  .row.me .ic { background: var(--bg); }
  .me-tag { display: none; font-size: 12px; font-weight: 800; color: var(--accent); }
  .row.me .me-tag { display: inline; }
  .st { margin: 0; font-size: 13px; font-weight: 800; color: var(--mute); }
  ol.s { margin: 12px 0 0; padding: 0; list-style: none; counter-reset: n; display: flex; flex-direction: column; gap: 14px; }
  ol.s li { counter-increment: n; display: grid; grid-template-columns: 26px 1fr; column-gap: 12px; row-gap: 2px; }
  ol.s li::before { content: counter(n); grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; background: var(--chip); color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  ol.s b { font-size: 15px; } ol.s span { font-size: 13.5px; color: var(--mute); }
  .alt { align-self: center; font-size: 13.5px; font-weight: 700; color: var(--accent); text-decoration: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .row.me { background: var(--chip); }
    :root:not([data-theme="light"]) .dlb:not(.off) { background: #FFFFFF; color: #1D1D76; }
  }

.row{flex-wrap:nowrap}

@media (max-width:560px){.row{flex-wrap:wrap}.act{margin-left:0;width:100%}.act>*{flex:1}.dlb,.row .act>span{width:100%;justify-content:center}.act>span{display:flex;align-items:center;justify-content:center;gap:8px}}
